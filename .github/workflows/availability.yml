name: Disponibilidade pública LIC
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
permissions:
  contents: read
concurrency:
  group: lic-availability
  cancel-in-progress: false
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar acesso, protecções e recursos de PDF e OCR
        run: node scripts/check-published.mjs
